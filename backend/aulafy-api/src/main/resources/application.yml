spring:
  application:
    name: aulafy-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:aulafy-development-secret-key-change-in-production-2026}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,${FRONTEND_URL:}}

jwt:
  secret: ${JWT_SECRET:${app.security.jwt.secret}}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    org.springframework.security: INFO
