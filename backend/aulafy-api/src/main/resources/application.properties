spring.application.name=aulafy-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aulafy_db}
spring.datasource.username=${DB_USERNAME:aulafy_user}
spring.datasource.password=${DB_PASSWORD:aulafy_pass}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET:aulafy-development-secret-key-change-in-production-2026}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

logging.level.org.springframework.security=INFO
