name: Backend Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'backend/aulafy-api/**'
      - '.github/workflows/backend-azure-app-service.yml'

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        working-directory: backend/aulafy-api
        run: mvn clean test

      - name: Package
        working-directory: backend/aulafy-api
        run: mvn clean package -DskipTests

      - name: Prepare deployment artifact
        run: |
          mkdir -p backend/aulafy-api/deploy
          cp backend/aulafy-api/target/*.jar backend/aulafy-api/deploy/app.jar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: aulafy-api-jar
          path: backend/aulafy-api/deploy/app.jar

  deploy:
    name: Deploy backend to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: staging

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: aulafy-api-jar
          path: deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy/app.jar
