name: Backend NestJS CI

on:
  push:
    branches:
      - develop
    paths:
      - "backend/aulafy-api-nest/**"
      - ".github/workflows/backend-nest-ci.yml"
  pull_request:
    paths:
      - "backend/aulafy-api-nest/**"
      - ".github/workflows/backend-nest-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build NestJS backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/aulafy-api-nest/package-lock.json

      - name: Install dependencies
        working-directory: backend/aulafy-api-nest
        run: npm install

      - name: Build
        working-directory: backend/aulafy-api-nest
        run: npm run build

      - name: Test
        working-directory: backend/aulafy-api-nest
        run: npm test
