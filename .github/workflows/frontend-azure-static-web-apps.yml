name: Frontend Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'frontend/aulafy-web/**'
      - '.github/workflows/frontend-azure-static-web-apps.yml'

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/aulafy-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/aulafy-web
        run: npm ci

      - name: Build staging
        working-directory: frontend/aulafy-web
        run: npm run build:staging

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: aulafy-web-static
          path: frontend/aulafy-web/dist/aulafy-web/browser

  deploy:
    name: Deploy frontend to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: staging

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: aulafy-web-static
          path: deploy

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy
          api_location: ''
          output_location: ''
          skip_app_build: true
