name: Frontend AWS S3 Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/aulafy-web/**"
      - ".github/workflows/frontend-aws-s3-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  AWS_S3_BUCKET_STAGING: ${{ vars.AWS_S3_BUCKET_STAGING }}
  AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build and deploy frontend to S3
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/aulafy-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/aulafy-web
        run: npm ci

      - name: Build staging frontend
        working-directory: frontend/aulafy-web
        run: npm run build:staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Upload files to S3
        run: |
          aws s3 sync \
            frontend/aulafy-web/dist/aulafy-web/browser \
            s3://${AWS_S3_BUCKET_STAGING} \
            --delete

      - name: Invalidate CloudFront cache
        if: ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
